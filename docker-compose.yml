services:
  db:
    image: postgres:16
    container_name: icesco_knowledge_forum_db
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_DB: icesco_knowledge_forum
      POSTGRES_USER: icesco
      POSTGRES_PASSWORD: icesco_dev
    volumes:
      - icesco_knowledge_forum_pgdata:/var/lib/postgresql/data

volumes:
  icesco_knowledge_forum_pgdata:
